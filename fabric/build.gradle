plugins {
    id 'java'
    id 'checkstyle'
    id 'fabric-loom' version '1.15.4'
}

// Versions live in ONE place: the NeoForge project's gradle.properties. Duplicating them per
// loader is how a release ends up with three jars claiming different Minecraft versions.
def shared = new Properties()
file('../neoforge/gradle.properties').withInputStream { shared.load(it) }
def sharedSrc = file('../common/src/main/java')
def sharedRes = file('../common/src/main/resources')

version = shared.mod_version
group = shared.mod_group_id

base {
    archivesName = "${shared.mod_archive_base_name}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Produces build/libs/NexusCore-<version>-fabric.jar, matching the NeoForge artifact's shape.
// Loom's remapJar produces the shippable artifact; the plain `jar` task produces an
// unmapped dev jar. The classifier has to go on remapJar or the released file is misnamed.
def mcVersion = shared.minecraft_version.toString()

tasks.named('remapJar') {
    archiveClassifier = mcVersion
}

tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
}

repositories {
    mavenCentral()
}

// The port's whole strategy: compile the *same* source files, not a copy of them. A copied
// tree diverges the first time someone fixes a bug in one and not the other. Only the entry
// point differs per platform, so only the entry point lives in this module.
//
// Mojang mappings are used rather than Yarn for the same reason — under Yarn every shared
// file would need different type names and none of this would compile unchanged.
sourceSets.main.java.srcDirs += sharedSrc
// Must be the resources ROOT, not the assets subdirectory: adding `.../resources/assets`
// puts its *contents* at the jar root, so the catalogue lands at /nexuscore/lang/en_us.json
// and MessageService cannot find /assets/nexuscore/lang/en_us.json. Caught on a real Fabric
// server, which reported "0 message(s)".
sourceSets.main.resources.srcDirs += sharedRes

// The shared TESTS run here too, not only on NeoForge. See the matching note in
// ../forge/build.gradle: until 1.1.1 every common test executed on one loader of three, while
// all three compiled the code under test.
sourceSets.test.java.srcDirs += file('../common/src/test/java')

// No excludes since 1.0.4: ../common holds only shared code. Previously this reached into
// ../neoforge/src and named the two NeoForge-only files by path string, here and in
// forge/build.gradle — so a new NeoForge-only class meant editing both, or shipping it into a
// Fabric jar where it would fail at class-load rather than at build time.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft "com.mojang:minecraft:${shared.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${shared.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${shared.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:${shared.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// §18.5 — reproducible archives: stable entry order, no embedded build timestamps.
//
// This was present only in neoforge/build.gradle until 1.0.4, so §18.5 held for exactly one of
// the three shipped jars. Two clean builds of an unchanged Forge tree produced different SHA-256
// sums; the Fabric jar happened to match because Loom's remapJar rewrites it, which is luck
// rather than a guarantee. Found by the byte-identity check this build's exit condition demands.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Fixed permissions, or the builder's umask ends up inside the archive. Confirmed by comparing
    // the v1.1.0 Forge jar built here against the one GitHub's runner built from the same tag: 112
    // bytes differed, every one of them the ZIP central directory's external-attributes field —
    // 0x81b4 (0664, this machine's umask 0002) against 0x81a4 (0644, the runner's). Same size, same
    // entries, byte-identical contents. Only Forge was affected, because it merges resources into
    // the classes directory and that copy preserves the source file's mode.
    //
    // So §18.5 held only WITHIN a machine: two clean builds here matched, and anyone else's did not.
    // For an archive whose stated purpose is that a bug report can be reproduced against the same
    // bytes, same-machine reproducibility is not the property that matters.
    filePermissions { unix(0644) }
    dirPermissions { unix(0755) }
}

checkstyle {
    toolVersion = '10.21.1'
    configFile = file('../config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

// Values are captured into a plain map here, outside the closure. Referencing `project`
// from inside a task action is not configuration-cache safe.
def modJsonValues = [
        version              : shared.mod_version.toString(),
        mod_id               : shared.mod_id.toString(),
        mod_display_name     : shared.mod_display_name.toString(),
        mod_authors          : shared.mod_authors.toString(),
        mod_license          : shared.mod_license.toString(),
        minecraft_version    : shared.minecraft_version.toString(),
        fabric_loader_version: shared.fabric_loader_version.toString()
]

tasks.named('processResources', ProcessResources) {
    inputs.properties modJsonValues
    filesMatching('fabric.mod.json') {
        expand modJsonValues
    }
}

// Lets the dev client auto-load a world so an INTEGRATED server actually starts:
//   ./gradlew runClient -PquickPlay=NexusTest
// This is how the singleplayer/LAN path gets tested. It is the path that was broken when the
// mod used a dedicated-server-only entrypoint and did nothing in singleplayer.
loom {
    runs {
        client {
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        // Runs the SHARED GameTests headlessly and exits non-zero on failure, the same job
        // neoforge's runGameTestServer does. Until 1.1.2 this did not exist on Fabric at all: the
        // tests compiled here and were exercised only on NeoForge, which is the "three loaders
        // compile it, one runs it" shape that hid for four builds in the unit suite.
        //
        // fabric-api.gametest is what switches the server into test mode; the report file is what
        // makes a run countable afterwards rather than merely green.
        gametest {
            server()
            name = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir 'build/gametest'
        }
    }
}

// §2.4 stub-marker gate and the ADR-0012 version gate. Shared by all three loader builds so a
// green build means the same thing in each — see gradle/gates.gradle for why that was not true
// before. Applied last so the gate sees sourceSets.main.java after the shared sources are added.
apply from: file('../gradle/gates.gradle')
