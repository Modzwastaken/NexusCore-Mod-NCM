plugins {
    id 'java'
    id 'checkstyle'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

// Versions live in ONE place: the NeoForge project's gradle.properties.
def shared = new Properties()
file('../neoforge/gradle.properties').withInputStream { shared.load(it) }
def sharedSrc = file('../common/src/main/java')
def sharedRes = file('../common/src/main/resources')

version = shared.mod_version
group = shared.mod_group_id

base {
    archivesName = "${shared.mod_archive_base_name}-forge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

// Same strategy as Fabric: compile the shared sources, do not copy them. Since 1.0.4 they live
// in ../common, which holds only shared code, so no excludes are needed here either.
sourceSets.main.java.srcDirs += sharedSrc
sourceSets.main.resources.srcDirs += sharedRes


// Send processed resources into the SAME directory as the compiled classes.
//
// ForgeGradle's dev runs put build/classes/java/main and build/resources/main on the
// classpath as two separate entries and never tell FML they are one mod. FML then finds
// mods.toml in the resources directory, treats that directory alone as the mod file, finds no
// @Mod class inside it, and aborts with "constructed 0 mods". Merging the two outputs gives
// FML a single directory holding both the metadata and the class, which is what it expects.
//
// This changes only where Gradle writes intermediates. The packaged jar is assembled from the
// same source-set output either way, so its contents are unchanged.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory

// RESOLVED at 1.0.1 — the dev runs below now load the mod.
//
// This block previously carried a KNOWN LIMITATION notice: `runClient` and `runServer` both
// failed with
//     File build/resources/main constructed 0 mods: [], but had 1 mods specified: [nexuscore]
// because FML saw the resources directory, which holds mods.toml, as a mod file with no @Mod
// class in it.
//
// Re-tested on 2026-07-26 and both now work. `runClient` reaches a world and logs
// `NexusCore ready on Forge … 94 message(s), 3 permission group(s)`, takes over the vanilla
// commands, and a player joins; `runServer` reaches ready state and answers `/nexus version`.
// The `constructed 0 mods` error does not appear in either.
//
// The fix is the `resourcesDir` merge immediately above — it was written as an attempted fix,
// the limitation notice was left in place, and nobody re-ran the dev tasks afterwards to find
// out that it had worked. The note outlived the bug by a whole release.
//
// The packaged jar remains the primary Forge test, because that is what ships: build it and
// drop it into a real Forge server's mods/ folder (see ../forgeserver). The dev runs are now a
// working convenience on top of that, not a replacement for it.
minecraft {
    mappings channel: 'official', version: shared.minecraft_version

    runs {
        configureEach {
            property 'forge.logging.console.level', 'info'
            // Both forms: the run-level source list and the named mod entry. FG's
            // getAllSources() unions them, and FML needs the mod NAME attached to the
            // output dirs to match mods.toml.
            source project.sourceSets.main
            mods {
                nexuscore {
                    source project.sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${shared.minecraft_version}-${shared.forge_version}"

    testImplementation platform("org.junit:junit-bom:${shared.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// §18.5 — reproducible archives: stable entry order, no embedded build timestamps.
//
// This was present only in neoforge/build.gradle until 1.0.4, so §18.5 held for exactly one of
// the three shipped jars. Two clean builds of an unchanged Forge tree produced different SHA-256
// sums; the Fabric jar happened to match because Loom's remapJar rewrites it, which is luck
// rather than a guarantee. Found by the byte-identity check this build's exit condition demands.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Fixed permissions, or the builder's umask ends up inside the archive. Confirmed by comparing
    // the v1.1.0 Forge jar built here against the one GitHub's runner built from the same tag: 112
    // bytes differed, every one of them the ZIP central directory's external-attributes field —
    // 0x81b4 (0664, this machine's umask 0002) against 0x81a4 (0644, the runner's). Same size, same
    // entries, byte-identical contents. Only Forge was affected, because it merges resources into
    // the classes directory and that copy preserves the source file's mode.
    //
    // So §18.5 held only WITHIN a machine: two clean builds here matched, and anyone else's did not.
    // For an archive whose stated purpose is that a bug report can be reproduced against the same
    // bytes, same-machine reproducibility is not the property that matters.
    filePermissions { unix(0644) }
    dirPermissions { unix(0755) }
}

// Same ruleset as the other two loaders, so a contribution cannot pass one build and fail
// another on formatting alone.
checkstyle {
    toolVersion = '10.21.1'
    configFile = file('../config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

// Token expansion for mods.toml, mirroring the NeoForge project. Values are captured into a
// plain map outside the closure so the task stays configuration-cache safe.
def modsTomlValues = [
        mod_id                 : shared.mod_id.toString(),
        mod_version            : shared.mod_version.toString(),
        mod_display_name       : shared.mod_display_name.toString(),
        mod_authors            : shared.mod_authors.toString(),
        mod_license            : shared.mod_license.toString(),
        minecraft_version_range: shared.minecraft_version_range.toString(),
        forge_loader_range     : shared.forge_loader_range.toString()
]

tasks.named('processResources', ProcessResources) {
    inputs.properties modsTomlValues
    filesMatching('META-INF/mods.toml') {
        expand modsTomlValues
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = shared.minecraft_version.toString()
}
