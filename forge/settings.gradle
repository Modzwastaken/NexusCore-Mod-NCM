pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

rootProject.name = 'NexusCore-forge'

// NOTE ON GRADLE VERSION
// This project pins Gradle 8.10.2 while neoforge/ and fabric/ use 9.2.1. That is deliberate:
// ForgeGradle 6.0.54 refuses to apply on Gradle 9.0 or newer ("Versions Gradle 9.0 and newer
// are not supported yet"). Because each loader is an independent build with its own wrapper,
// Forge can sit on 8.x without dragging the other two backwards. This is the main practical
// reason the loaders are separate builds rather than one multi-project.
