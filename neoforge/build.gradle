plugins {
    id 'java-library'
    id 'checkstyle'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    // Includes the Minecraft version: a 1.21.1 JAR and a future 1.22 JAR are not
    // interchangeable, and the filename is the only thing an operator sees before installing.
    // Produces NexusCore-<minecraft_version>-<mod_version>-<loader>.jar.
    archivesName = "${mod_archive_base_name}-${mod_loader_name}"
}

// The mod loader is part of the artifact's identity: a NeoForge JAR and a Forge JAR for the
// same Minecraft version are not interchangeable, and a server operator downloading the wrong
// one gets a mod that silently does not load. Naming it in the file removes that class of
// mistake. Produces build/libs/NexusCore-<version>-neoforge.jar.
tasks.named('jar', Jar) {
    archiveClassifier = minecraft_version
}

// §4.1 — Java 21, matching the JRE Mojang ships for 1.21.1.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

// The shared sources live in ../common and are compiled identically by all three loaders. This
// project keeps only what is genuinely NeoForge-specific: the @Mod entry point and the
// creative_flight controller. Before 1.0.4 the shared code lived here and the other two loaders
// reached into it and excluded those two files by path string — so the layout claimed NeoForge
// owned code that every loader compiles, and adding a NeoForge-only class silently required edits
// in two other build files.
sourceSets.main.java.srcDirs += file('../common/src/main/java')
sourceSets.main.resources.srcDirs += file('../common/src/main/resources')
sourceSets.test.java.srcDirs += file('../common/src/test/java')

repositories {
    mavenCentral()
}

dependencies {
    // The pinned NeoForge userdev artifact. See ADR-0001.
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources {
    exclude('**/*.bbmodel')
}

// Default run configurations. `runServer` is the milestone-exit verification target;
// `runClient` is not used until M9 but is kept working so the toolchain stays honest.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', ''
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // ./gradlew runClient -PquickPlay=NexusTest loads a world straight away, so the
        // integrated-server path gets exercised rather than just the main menu.
        if (project.hasProperty('quickPlay')) {
            argument '--quickPlaySingleplayer'
            argument project.property('quickPlay').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // Runs every registered GameTest headlessly and exits. Wired into CI from M5,
    // when the first GameTests exist. Running it before then fails by design.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

// NeoGradle's run tasks are JavaExec tasks, and Gradle gives JavaExec an *empty* standard
// input by default. Without this, `./gradlew runServer` starts a dedicated server whose
// console cannot be typed into — no `stop`, no commands, no clean shutdown, only SIGTERM
// and a non-zero exit. Forward the real console so the development server behaves like a
// server. `System.in` is not serialisable, so this is applied at execution time.
tasks.withType(JavaExec).configureEach {
    if (name.startsWith('run')) {
        doFirst {
            standardInput = System.in
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // §17.2 — NexusCore-introduced warnings are reviewed, not hidden.
    options.compilerArgs.addAll(['-Xlint:all,-processing,-serial'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

// §18.5 — reproducible archives: stable entry order, no embedded build timestamps.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Fixed permissions, or the builder's umask ends up inside the archive. Confirmed by comparing
    // the v1.1.0 Forge jar built here against the one GitHub's runner built from the same tag: 112
    // bytes differed, every one of them the ZIP central directory's external-attributes field —
    // 0x81b4 (0664, this machine's umask 0002) against 0x81a4 (0644, the runner's). Same size, same
    // entries, byte-identical contents. Only Forge was affected, because it merges resources into
    // the classes directory and that copy preserves the source file's mode.
    //
    // So §18.5 held only WITHIN a machine: two clean builds here matched, and anyone else's did not.
    // For an archive whose stated purpose is that a bug report can be reproduced against the same
    // bytes, same-machine reproducibility is not the property that matters.
    filePermissions { unix(0644) }
    dirPermissions { unix(0755) }
}

// Static analysis and formatting gate (§17.2). Checkstyle covers both: the ruleset in
// config/checkstyle/checkstyle.xml contains formatting rules as well as correctness rules.
// See docs/architecture/ADR-0005.md.
checkstyle {
    toolVersion = '10.21.1'
    configFile = rootProject.file('../config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

// Token expansion for neoforge.mods.toml. A missing property is a hard error, which is
// what keeps gradle.properties and the metadata from drifting apart.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// §12.5 — the command reference is generated from CommandCatalogue, never written by hand. The
// hand-maintained version drifted for two releases: it told operators NexusCore does NOT override
// /ban, /kick and /banlist, in its "read this first" section, after the v1.0 takeover made that
// false. CommandDocsTest fails the build if this file and the catalogue disagree.
tasks.register('generateCommandDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerates docs/admin/commands.md from CommandCatalogue (§12.5).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mwtstudios.nexuscore.command.CommandDocsGenerator'
    args rootProject.file('../docs/admin/commands.md').absolutePath
}

// §2.4 stub-marker gate and the ADR-0012 version gate. Shared by all three loader builds so a
// green build means the same thing in each — see gradle/gates.gradle for why that was not true
// before. Applied last so the gate sees sourceSets.main.java after the shared sources are added.
apply from: file('../gradle/gates.gradle')
