# NexusCore Administration Framework — Gradle properties
# All versions here are PINNED. No `+`, no `latest.release`. See docs/architecture/ADR-0001.md.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (parameter names for the decompiled sources). Pinned to the 1.21.1 set.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Platform versions — verified 2026-07-25 against maven.neoforged.net, recorded in ADR-0001

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Pinned NeoForge patch. See ADR-0001 for why this build and not the newest published one.
neo_version=21.1.235
# Lowest NeoForge build NexusCore is compiled against and supported on; newer 21.1.x is allowed.
neo_version_range=[21.1.235,)
loader_version_range=[1,)

## Mod properties

mod_id=nexuscore
mod_name=NexusCore
mod_display_name=NexusCore Administration Framework
mod_license=All Rights Reserved
# The version scheme is ADR-0012:
#   x.y.0          a VERSION — 1.0.0, 1.1.0, 1.2.0 …
#   x.y.1 - x.y.5  its BUILDS — each a hotfix or a pre-release
#   x.y.6          does not exist; five builds fill a version, then the minor moves up
# Bumped at the START of the work, not at the end. What each build contains is planned in
# IMPLEMENTATION_STATUS.md under "The road to v1.5.0". `versionLadderCheck` fails the build if
# this value is malformed, out of range, or has no matching entry in the shared CHANGELOG.md.
mod_version=1.1.0
mod_group_id=com.mwtstudios.nexuscore
mod_authors=MWT Studios
# Produces build/libs/NexusCore-<mod_version>-<mod_loader_name>.jar
mod_archive_base_name=NexusCore
# The mod loader this build targets. Part of the artifact name so a NeoForge JAR can never be
# mistaken for a Forge or Fabric one.
mod_loader_name=neoforge

## Test dependencies — pinned

junit_version=5.11.4

## Fabric port — pinned, verified 2026-07-26 against meta.fabricmc.net and maven.fabricmc.net

fabric_loader_version=0.19.3
fabric_api_version=0.116.14+1.21.1
forge_version=52.1.16
forge_loader_range=[52,)
