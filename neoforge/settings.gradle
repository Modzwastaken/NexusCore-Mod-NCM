pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NexusCore'

// Each mod loader is an independent Gradle build in its own sibling directory
// (neoforge/, fabric/, forge/). They share source rather than a build: see
// ../fabric/build.gradle, which compiles this project's src/main/java directly.
