# NexusCore Administration Framework — mod metadata.
#
# This is the ONLY metadata file NexusCore registers (§4.3). There is no legacy mods.toml.
# Every placeholder token below is expanded from gradle.properties by the ProcessResources
# task, so the versions here cannot drift from the versions the project is compiled against.
# A token naming a property that does not exist is a hard build failure, by design.
#
# Note: this file is processed by Groovy's template engine. A dollar-brace sequence anywhere
# in it — including inside a comment — is evaluated as an expression, so do not write one
# unless it names a real property.
#
# §18.4 held back website and issue-tracker URLs until real ones existed, on the grounds that a
# placeholder URL is worse than no URL. Both now exist and are declared below. No updateJSONURL
# is declared: that endpoint has to serve a real version manifest, and none is published yet.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Modzwastaken/NexusCore-Mod-NCM/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
displayURL = "https://mwtstudios.net"
logoFile = "nexuscore.png"
description = '''
NexusCore is a native server administration framework for Minecraft Java Edition:
permissions, moderation, teleportation, player utilities, staff tools, configuration
and a tamper-evident audit log in one mod, with no Bukkit/Spigot plugin and no other
administration mod required.

Server-side only. Install this JAR on the dedicated server; players join with an
unmodified vanilla client, admin GUI included.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
