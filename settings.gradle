pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NexusCore'

// The root project is the NeoForge build. Fabric is a sibling module that compiles the same
// shared sources with its own toolchain; nothing is moved, so the released NeoForge build is
// unaffected by the port. See docs/architecture/ADR-0008.md.
include 'fabric'
